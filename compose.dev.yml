services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cape
      POSTGRES_PASSWORD: cape
      POSTGRES_DB: cape
    ports:
      - "127.0.0.1:${CAPE_DB_PORT:-5432}:5432"
    volumes:
      - cape_pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cape -d cape"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cape_pg_dev:
