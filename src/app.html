<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0d14" />

    <link rel="dns-prefetch" href="https://cape.co" />
    <link
      rel="preconnect"
      href="https://challenges.cloudflare.com"
      crossorigin
    />

    <meta name="robots" content="max-image-preview:large" />

    <meta property="og:site_name" content="cape.rip" />
    <meta property="og:image" content="https://cape.rip/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="cape.rip — The community hub for Cape Cellular"
    />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://cape.rip/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://cape.rip/#org",
            "name": "cape.rip",
            "url": "https://cape.rip/",
            "description": "Independent community hub for Cape Cellular users. Not affiliated with, endorsed by, or operated by Cape Cellular.",
            "sameAs": ["https://github.com/lb-vn/caperip"]
          },
          {
            "@type": "WebSite",
            "@id": "https://cape.rip/#site",
            "url": "https://cape.rip/",
            "name": "cape.rip",
            "inLanguage": "en-US",
            "publisher": { "@id": "https://cape.rip/#org" }
          }
        ]
      }
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="antialiased">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
